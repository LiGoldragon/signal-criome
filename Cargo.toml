[package]
name         = "signal-criome"
version      = "0.15.1"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/signal-criome"
description  = "Signal contract for Criome trust and attestation records."
publish      = false
links        = "signal-criome"
build        = "build.rs"

[lib]
name = "signal_criome"
path = "src/lib.rs"

[features]
default = []
dotos-text = ["dep:dotos", "signal-frame/dotos-text", "signal-standard/dotos-text"]

[dependencies]
dotos = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "b3c2c76fe7a18ba026ab054d1fa7162e55860b9e", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "80f70d929ae6d72707052f097be2264872913983", default-features = false }
signal-standard = { git = "https://github.com/LiGoldragon/signal-standard.git", rev = "f12d0cb9e4809e13002b4e6eedf64398a23cd8dc", default-features = false }
thiserror = "2"

[build-dependencies]
schema-rust = { package = "schema-rust", git = "https://github.com/LiGoldragon/schema-rust.git", rev = "37b7d1035a472a15081f3e2e8a93b95bf733c3ee", default-features = false }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
